<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Pocket</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Planning Pocket</h1>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" style="text-decoration:none; color:inherit;">Dashboard</a> | 
                <span>{{ user.username }}</span> | 
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; color:var(--primary); border:none; padding:0; font-weight:normal; text-decoration:underline;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a> | <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // Global UX improvements
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                const btn = this.querySelector('button[type="submit"]');
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = 'Processing...';
                }
            });
        });
    </script>
</body>
</html>
