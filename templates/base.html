<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Pocket</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'dashboard' %}" style="text-decoration:none; color:inherit;">Planning Pocket</a></h1>
        <div style="display:flex; gap:1.25rem; align-items:center;">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" style="text-decoration:none; color:var(--text-muted); font-weight:500;">Dashboard</a>
                <span style="color:var(--text-main); font-weight:600; padding: 0.25rem 0.75rem; background-color:var(--bg-color); border-radius:var(--radius-pill); border: 1px solid var(--border-color);">{{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline; margin:0;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; color:var(--text-muted); border:none; padding:0; box-shadow:none; font-weight:500;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" style="text-decoration:none; color:var(--text-muted); font-weight:500;">Login</a>
                <a href="{% url 'register' %}" style="text-decoration:none; color:var(--primary-text); background-color:var(--primary); padding:0.5rem 1rem; border-radius:var(--radius-md); font-weight:500;">Register</a>
            {% endif %}
        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // Global UX improvements
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                const btn = this.querySelector('button[type="submit"]');
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = 'Processing...';
                }
            });
        });
    </script>
</body>
</html>
