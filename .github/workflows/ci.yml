#
# Validación de cada cambio antes de que llegue a main. Sigue GitHub Flow: main siempre
# desplegable, todo lo demás entra por pull request y tiene que pasar por aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: python -m ruff check --output-format=github .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es el suelo real: Django 6.1 exige >=3.12. 3.13 es lo que corre la imagen.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: pytest con cobertura
        run: python -m pytest . -p no:cacheprovider --cov --cov-report=term-missing --cov-report=xml
      - name: Guardar el reporte de cobertura
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  django-checks:
    name: Django (dev y producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: manage.py check
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py check --fail-level WARNING

      - name: Sin migraciones pendientes
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run

      # Este es el trabajo que importa. La suite corre con config.settings_test, que
      # desactiva whitenoise, HSTS y las cookies seguras. Sin este paso, un fallo en la
      # configuración real de producción no lo ve nadie hasta el despliegue.
      - name: check --deploy con DEBUG=False
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "planning-pocket.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://planning-pocket.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py check --deploy --fail-level WARNING

      - name: collectstatic con el storage de producción
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "planning-pocket.example.com"
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py collectstatic --noinput

  e2e:
    name: Navegador (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: pytest -m e2e
        # Playwright deja a Django viendo un contexto async y rechazando cada consulta
        # síncrona. Sólo se activa aquí, nunca en la corrida por defecto: ver docs/TESTING.md.
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
        run: python -m pytest -m e2e -p no:cacheprovider
      - name: Guardar las trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-output
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: planning-pocket:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Construir no basta: la imagen tiene que arrancar con la configuración real.
      - name: La imagen arranca con DEBUG=False
        run: |
          docker run --rm \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY="$(head -c 64 /dev/urandom | base64 | tr -d '\n')" \
            -e DJANGO_ALLOWED_HOSTS=planning-pocket.example.com \
            --entrypoint python \
            planning-pocket:ci manage.py check --deploy --fail-level WARNING

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, django-checks, e2e, docker]
    if: always()
    steps:
      # Un único check al que apuntar desde la protección de rama, en vez de tener que
      # mantener la lista de jobs sincronizada a mano en los ajustes del repo.
      - name: Verificar que no falló nada
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "django-checks=${{ needs.django-checks.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "docker=${{ needs.docker.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
