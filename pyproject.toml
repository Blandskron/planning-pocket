[project]
name = "planning_pocket"
version = "0.1.0"
description = "Planning Poker Online Alternative"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--nomigrations --tb=short -m 'not e2e'"
markers = [
    "e2e: browser tests driven by Playwright. Excluded from the default run; see docs/TESTING.md.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".venv*",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
