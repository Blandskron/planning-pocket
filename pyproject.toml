[project]
name = "planning_pocket"
version = "1.0.0"
description = "Planning Poker Online Alternative"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--nomigrations --tb=short -m 'not e2e'"
markers = [
    "e2e: browser tests driven by Playwright. Excluded from the default run; see docs/TESTING.md.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".venv*",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.coverage.run]
branch = true
source = ["accounts", "config", "rooms"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings_test.py",
]

[tool.coverage.report]
# 80% general es el objetivo declarado en AGENTS.md, y la suite está justo por encima
# (80.48%). El margen es estrecho a propósito: quien baje la cobertura se entera en el PR,
# no seis meses después. El punto flojo conocido es rooms/consumers.py (67%).
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
